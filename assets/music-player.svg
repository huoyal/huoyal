<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">Animated music player card</title>
  <desc id="desc">A soft animated music player card with a spinning disc and equalizer bars.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2f8"/>
      <stop offset="45%" stop-color="#f1fbff"/>
      <stop offset="100%" stop-color="#f3fff0"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7cad"/>
      <stop offset="48%" stop-color="#54c6eb"/>
      <stop offset="100%" stop-color="#78d878"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8c91a3" flood-opacity=".18"/>
    </filter>
    <style>
      .title { font: 800 35px 'Segoe UI', Arial, sans-serif; fill: #2d3548; }
      .sub { font: 600 20px 'Segoe UI', Arial, sans-serif; fill: #647084; }
      .tiny { font: 700 15px 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #ffffff; }
      .spin { animation: spin 8s linear infinite; transform-origin: 168px 130px; }
      .float { animation: float 4.8s ease-in-out infinite; }
      .note-a { animation: noteA 3.4s ease-in-out infinite; }
      .note-b { animation: noteB 4.2s ease-in-out infinite; }
      .bar1 { animation: bar 1.0s ease-in-out infinite; transform-origin: center bottom; }
      .bar2 { animation: bar 1.3s ease-in-out infinite; transform-origin: center bottom; animation-delay: .12s; }
      .bar3 { animation: bar 1.1s ease-in-out infinite; transform-origin: center bottom; animation-delay: .24s; }
      .bar4 { animation: bar 1.5s ease-in-out infinite; transform-origin: center bottom; animation-delay: .36s; }
      .bar5 { animation: bar 1.2s ease-in-out infinite; transform-origin: center bottom; animation-delay: .48s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes noteA { 0%,100% { opacity: .25; transform: translateY(10px); } 50% { opacity: 1; transform: translateY(-12px); } }
      @keyframes noteB { 0%,100% { opacity: .35; transform: translateY(-4px); } 50% { opacity: 1; transform: translateY(14px); } }
      @keyframes bar { 0%,100% { transform: scaleY(.42); } 50% { transform: scaleY(1); } }
    </style>
  </defs>

  <rect x="18" y="18" width="944" height="224" rx="34" fill="url(#card)" filter="url(#shadow)"/>
  <circle cx="840" cy="58" r="58" fill="#ffffff" opacity=".65" class="float"/>
  <circle cx="742" cy="214" r="42" fill="#ffffff" opacity=".72" class="float"/>
  <circle cx="74" cy="64" r="36" fill="#ffffff" opacity=".72"/>

  <g class="spin">
    <circle cx="168" cy="130" r="78" fill="url(#disc)"/>
    <circle cx="168" cy="130" r="48" fill="#ffffff" opacity=".26"/>
    <circle cx="168" cy="130" r="18" fill="#ffffff"/>
    <circle cx="168" cy="130" r="7" fill="#647084"/>
    <path d="M168 54a76 76 0 0 1 76 76" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity=".36"/>
  </g>

  <g transform="translate(300 78)">
    <text class="title" x="0" y="0">Music Corner</text>
    <text class="sub" x="0" y="38">Pick a track and let the page play a little tune.</text>
    <g transform="translate(0 76)">
      <rect width="138" height="34" rx="17" fill="#ff7cad"/>
      <rect x="154" width="142" height="34" rx="17" fill="#54c6eb"/>
      <rect x="312" width="152" height="34" rx="17" fill="#78d878"/>
      <text class="tiny" x="27" y="22">mp3 files</text>
      <text class="tiny" x="182" y="22">native audio</text>
      <text class="tiny" x="346" y="22">github ready</text>
    </g>
  </g>

  <g transform="translate(706 82)">
    <rect class="bar1" x="0" y="54" width="16" height="64" rx="8" fill="#ff7cad"/>
    <rect class="bar2" x="30" y="26" width="16" height="92" rx="8" fill="#54c6eb"/>
    <rect class="bar3" x="60" y="44" width="16" height="74" rx="8" fill="#78d878"/>
    <rect class="bar4" x="90" y="14" width="16" height="104" rx="8" fill="#ffbf66"/>
    <rect class="bar5" x="120" y="38" width="16" height="80" rx="8" fill="#b89cff"/>
  </g>

  <text class="note-a" x="822" y="84" font-size="35" fill="#ff7cad">♪</text>
  <text class="note-b" x="878" y="158" font-size="42" fill="#54c6eb">♫</text>
  <text class="note-a" x="84" y="204" font-size="38" fill="#78d878">♪</text>
</svg>
