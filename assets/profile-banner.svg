<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Animated profile banner for huoyal</title>
  <desc id="desc">A soft animated banner with floating shapes, code blocks, and the huoyal profile name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ad">
        <animate attributeName="stop-color" values="#fff7ad;#ffd6e8;#c8f7ff;#fff7ad" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#ffd6e8">
        <animate attributeName="stop-color" values="#ffd6e8;#c8f7ff;#d9f7be;#ffd6e8" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c8f7ff">
        <animate attributeName="stop-color" values="#c8f7ff;#d9f7be;#fff7ad;#c8f7ff" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6a7b8f" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 800 76px 'Segoe UI', Arial, sans-serif; fill: #283447; }
      .sub { font: 500 27px 'Segoe UI', Arial, sans-serif; fill: #4f6074; }
      .mono { font: 700 21px 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #4f6074; }
      .tiny { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .float-a { animation: floatA 5.5s ease-in-out infinite; }
      .float-b { animation: floatB 6.5s ease-in-out infinite; }
      .float-c { animation: floatC 7.5s ease-in-out infinite; }
      .twinkle { animation: twinkle 2.6s ease-in-out infinite; transform-origin: center; }
      .twinkle:nth-of-type(2n) { animation-delay: .4s; }
      .twinkle:nth-of-type(3n) { animation-delay: .9s; }
      .orbit { animation: orbit 18s linear infinite; transform-origin: 910px 160px; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(16px) translateX(10px); } }
      @keyframes floatC { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
      @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.72); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .82; } 50% { transform: scale(1.06); opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="95" cy="84" r="64" fill="#ffffff" opacity=".42" class="float-a"/>
  <circle cx="1120" cy="274" r="86" fill="#ffffff" opacity=".34" class="float-b"/>
  <circle cx="1010" cy="76" r="38" fill="#ffffff" opacity=".48" class="float-c"/>

  <g opacity=".78">
    <path class="twinkle" d="M190 61l8 18 19 7-19 7-8 18-8-18-19-7 19-7z" fill="#ffffff"/>
    <path class="twinkle" d="M1049 124l6 13 14 5-14 5-6 13-6-13-14-5 14-5z" fill="#ffffff"/>
    <path class="twinkle" d="M108 254l7 15 16 6-16 6-7 15-7-15-16-6 16-6z" fill="#ffffff"/>
    <path class="twinkle" d="M704 73l5 11 12 4-12 4-5 11-5-11-12-4 12-4z" fill="#ffffff"/>
  </g>

  <g filter="url(#shadow)" class="float-c">
    <rect x="110" y="112" width="340" height="172" rx="28" fill="#ffffff" opacity=".76"/>
    <rect x="142" y="145" width="96" height="18" rx="9" fill="#ff8db4"/>
    <rect x="142" y="183" width="220" height="18" rx="9" fill="#72d7ff"/>
    <rect x="142" y="221" width="164" height="18" rx="9" fill="#95df8f"/>
    <circle cx="386" cy="154" r="16" fill="#ffe16b"/>
    <text x="142" y="269" class="mono">const joy = build();</text>
  </g>

  <g transform="translate(502 102)">
    <text x="0" y="78" class="title">huoyal</text>
    <text x="5" y="122" class="sub">building small things with care</text>
    <g transform="translate(6 158)">
      <rect width="128" height="38" rx="19" fill="#ff8db4"/>
      <rect x="146" width="128" height="38" rx="19" fill="#54c6eb"/>
      <rect x="292" width="128" height="38" rx="19" fill="#78d878"/>
      <text x="33" y="25" class="tiny">code</text>
      <text x="178" y="25" class="tiny">learn</text>
      <text x="323" y="25" class="tiny">share</text>
    </g>
  </g>

  <g class="orbit">
    <circle cx="910" cy="52" r="13" fill="#ffffff" opacity=".92"/>
    <circle cx="1012" cy="172" r="10" fill="#ffffff" opacity=".76"/>
    <circle cx="828" cy="236" r="11" fill="#ffffff" opacity=".82"/>
  </g>
  <g filter="url(#shadow)" class="pulse">
    <rect x="858" y="124" width="174" height="112" rx="30" fill="#ffffff" opacity=".78"/>
    <circle cx="912" cy="172" r="18" fill="#ff8db4"/>
    <circle cx="978" cy="172" r="18" fill="#54c6eb"/>
    <path d="M910 210c24 18 54 18 78 0" fill="none" stroke="#4f6074" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
